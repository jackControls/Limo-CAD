[package]
name = "xtask"
version.workspace = true
edition = "2021"
description = "Repo maintenance tasks (MCP client install, etc.)"
license = "LGPL-2.1-or-later"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "raw_value"] }
regex = "1.13.1"
semver = "1.0.28"
tempfile = "3.27.0"
toml_edit = "0.25.15"
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
ureq = "3.4.2"
time = { version = "0.3.55", features = ["parsing"] }
tar = "0.4.46"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

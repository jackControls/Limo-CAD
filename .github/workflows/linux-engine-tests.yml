name: Linux engine tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'knowledge/**'
      - 'examples/scripts/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/linux-engine-tests.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'knowledge/**'
      - 'examples/scripts/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/linux-engine-tests.yml'

permissions:
  contents: read

concurrency:
  group: linux-engine-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine-tests:
    name: Ubuntu host-neutral crates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test complete host-neutral workspace
        run: cargo test --locked --workspace

name: Windows IME prerequisite probe

on:
  workflow_dispatch:
    inputs:
      provision-japanese:
        description: Install missing Japanese capabilities and enable the IME only on this disposable runner
        type: boolean
        default: false
      exercise-ime:
        description: Send real keys to an owned stock Windows textbox (does not validate Bevy)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    name: Inventory or explicitly provision the disposable Windows IME
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe Windows IME prerequisites
        timeout-minutes: 15
        shell: powershell
        env:
          PROBE_PROVISION: ${{ inputs.provision-japanese }}
          PROBE_EXERCISE: ${{ inputs.exercise-ime }}
        run: |
          $probeArgs = @{ Out = Join-Path $env:RUNNER_TEMP 'windows-ime-probe' }
          if ($env:PROBE_PROVISION -eq 'true') { $probeArgs.ProvisionJapanese = $true }
          if ($env:PROBE_EXERCISE -eq 'true') { $probeArgs.ExerciseIme = $true }
          & .\xtask\platform\windows-ime-probe.ps1 @probeArgs
      - name: Retain inventory, provisioning status, and actual IME messages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ime-prerequisite-probe
          path: ${{ runner.temp }}/windows-ime-probe/
          if-no-files-found: error
          retention-days: 14

name: Native desktop host tests

# The root workspace deliberately excludes `src-tauri`, so
# `linux-engine-tests.yml` never reaches the desktop shell, and the packaging
# workflow only runs `tauri build` — no test harness. Before this workflow the
# normal desktop build was unit-tested nowhere, and everything behind
# `dev-bevy-host` was neither compiled nor tested by any check.
#
# Both configurations matter:
#   * the default build is what ships today and what the existing shell uses;
#   * `dev-bevy-host` is the temporary native host that is replacing it, and it
#     is the only configuration that compiles the interface shell, the winit
#     host, the native sketch editor and the native Extrude form.

on:
  workflow_dispatch:
    inputs:
      desktop-input:
        description: Exercise OS keyboard and clipboard input on the disposable runner desktop
        type: boolean
        default: false
      native-packages:
        description: Build diagnostic Bevy DEB/AppImage packages and test their owned X11 desktop input
        type: boolean
        default: false
  workflow_call:
    inputs:
      desktop-input:
        type: boolean
        default: false
      native-packages:
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-host-tests.yml'
      - '.github/actions/setup-linux-desktop/**'
      - 'scripts/*linux*'
      - 'xtask/platform/**'
      - 'xtask/src/native_platform_test.rs'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-host-tests.yml'
      - '.github/actions/setup-linux-desktop/**'
      - 'scripts/*linux*'
      - 'xtask/platform/**'
      - 'xtask/src/native_platform_test.rs'

permissions:
  contents: read

concurrency:
  group: native-host-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  packaged-native-host:
    name: Opt-in Ubuntu packaged Bevy host
    if: inputs.native-packages
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Isolate diagnostic package outputs
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/native-package-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Ubuntu desktop and disposable-input SDK
        uses: ./.github/actions/setup-linux-desktop
        with:
          desktop-input: 'true'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/native-package-target
          key: native-package-linux-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            native-package-linux-${{ runner.arch }}-
      - run: npm ci --ignore-scripts
      - name: Build and audit locked diagnostic Bevy packages
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$(realpath -m "$CARGO_TARGET_DIR/release/bundle")"
          test "$bundle_root" = "$RUNNER_TEMP/native-package-target/release/bundle"
          rm -rf -- "$bundle_root/deb" "$bundle_root/appimage"
          node scripts/bundle-linux.mjs --native-host
          test "$(find "$bundle_root/deb" -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find "$bundle_root/appimage" -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
      - name: Exercise extracted DEB and AppImage at 100% and 200% scale
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$CARGO_TARGET_DIR/release/bundle"
          deb="$(find "$bundle_root/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          appimage="$(find "$bundle_root/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          bash scripts/verify-linux-native-package.sh "$deb" "$RUNNER_TEMP/native-package-evidence/deb"
          bash scripts/verify-linux-native-package.sh "$appimage" "$RUNNER_TEMP/native-package-evidence/appimage"
      - name: Retain packaged native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-package-linux-diagnostics
          path: ${{ runner.temp }}/native-package-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain diagnostic packages (never publish a release)
        uses: actions/upload-artifact@v4
        with:
          name: native-package-linux-dev-bevy-host
          path: |
            ${{ runner.temp }}/native-package-target/release/bundle/deb/*.deb*
            ${{ runner.temp }}/native-package-target/release/bundle/appimage/*.AppImage*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native-host-tests:
    name: Ubuntu desktop shell and native host
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out noBS CAD
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Mirrors the OpenCASCADE/desktop SDK set the Linux packaging job already
      # proves works for this crate, so the two share one dependency contract.
      - name: Install Ubuntu desktop SDK
        uses: ./.github/actions/setup-linux-desktop
        with:
          desktop-input: ${{ inputs.desktop-input }}

      - name: Cache Rust build
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: native-host-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            native-host-${{ runner.arch }}-

      # tauri.linux.conf.json declares bundle resources from both node_modules
      # (`opencascade.js/LICENSE`) and the staged license notices, so tauri-build
      # fails unless the frontend dependencies are installed and the packaging
      # script's staging step has run.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Stage the Linux bundle license notices
        run: node scripts/bundle-linux.mjs --stage-licenses

      # The shipping configuration. This is the only check that compiles the
      # desktop shell's own unit tests at all.
      - name: Test the default desktop build
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Test concurrent first-use OCCT projection
        run: cargo test --locked -p nbcad-occt --features native-occt --test concurrent_drawing_init

      # The native host being built to replace the React shell. Without this
      # step none of the interface shell, winit host, native editor or native
      # Extrude form is compiled by any workflow.
      - name: Test the native Bevy host
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features dev-bevy-host

      - name: Build the live native host
        id: native-build
        if: inputs.desktop-input
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features dev-bevy-host --bin nbcad

      - name: Verify installed CJK and emoji fonts through Bevy shaping
        if: inputs.desktop-input
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features dev-bevy-host --lib native_font_fallback_shapes_ -- --ignored --nocapture

      - name: Exercise X11 keyboard and clipboard at 100% and 200% scale
        if: inputs.desktop-input
        shell: bash
        run: |
          set -euo pipefail
          for scale in 1 2; do
            WINIT_X11_SCALE_FACTOR="$scale" xvfb-run --auto-servernum --server-args='-screen 0 2560x1600x24' \
              cargo xtask test-mcp native-platform --desktop-input \
              --server "$GITHUB_WORKSPACE/src-tauri/target/debug/nbcad" \
              --out "$RUNNER_TEMP/native-input-linux-$scale"
          done

      - name: Exercise real IBus preedit, commit, cancel and candidate placement
        if: inputs.desktop-input
        shell: bash
        run: |
          set -euo pipefail
          for scale in 1 2; do
            WINIT_X11_SCALE_FACTOR="$scale" dbus-run-session -- \
              xvfb-run --auto-servernum --server-args='-screen 0 2560x1600x24' \
              bash xtask/platform/run-linux-ime.sh \
              "$GITHUB_WORKSPACE/src-tauri/target/debug/nbcad" \
              "$RUNNER_TEMP/native-input-linux-ime-$scale"
          done

      - name: Exercise real XTEST paper navigation and annotation click/drag at 100% and 200%
        if: inputs.desktop-input
        shell: bash
        run: |
          set -euo pipefail
          python3 xtask/platform/test_native_drawing_linux.py
          for scale in 1 2; do
            WINIT_X11_SCALE_FACTOR="$scale" xvfb-run --auto-servernum --server-args='-screen 0 2560x1600x24' \
              cargo xtask test-mcp native-drawing-platform --desktop-input --authoring-input \
              --server "$GITHUB_WORKSPACE/src-tauri/target/debug/nbcad" \
              --out "$RUNNER_TEMP/native-input-linux-drawing-$scale"
          done

      - name: Exercise real XTEST CAM row dragging at 100% and 200%
        if: inputs.desktop-input
        shell: bash
        run: |
          set -euo pipefail
          python3 xtask/platform/test_native_cam_row_linux.py
          for scale in 1 2; do
            WINIT_X11_SCALE_FACTOR="$scale" xvfb-run --auto-servernum --server-args='-screen 0 2560x1600x24' \
              cargo xtask test-mcp native-cam-platform --desktop-input \
              --server "$GITHUB_WORKSPACE/src-tauri/target/debug/nbcad" \
              --out "$RUNNER_TEMP/native-input-linux-cam-$scale"
          done

      - name: Retain Linux input snapshots and native captures
        if: always() && inputs.desktop-input
        uses: actions/upload-artifact@v4
        with:
          name: native-input-linux
          path: ${{ runner.temp }}/native-input-linux-*/
          if-no-files-found: warn
          retention-days: 14

      # A failing live check must stay failed, but its successful build is
      # still useful. The automatic cache post-step otherwise skips failures,
      # forcing every input-fixture correction to rebuild Bevy from scratch.
      - name: Preserve successful build cache after a live-check failure
        if: failure() && inputs.desktop-input && steps.native-build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: native-host-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'crates/**/Cargo.toml') }}

  macos-native-host-tests:
    name: macOS native Bevy host
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: native-host-macos
      - name: Install native geometry kernel
        run: |
          brew install opencascade
          echo "OCCT_ROOT=$(brew --prefix opencascade)" >> "$GITHUB_ENV"
      - name: Test concurrent first-use OCCT projection
        run: cargo test --locked -p nbcad-occt --features native-occt --test concurrent_drawing_init

      - name: Test the native Bevy host
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features dev-bevy-host --lib
      - name: Build the live native host
        if: inputs.desktop-input
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features dev-bevy-host --bin nbcad
      # CoreGraphics sends real OS events into the Winit window. If the runner's
      # TCC policy disallows event posting, report the failure, never a fake pass.
      - name: Verify installed CJK and emoji fonts through Bevy shaping
        if: inputs.desktop-input
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features dev-bevy-host --lib native_font_fallback_shapes_ -- --ignored --nocapture
      - name: Exercise macOS Command shortcuts and clipboard
        if: inputs.desktop-input
        run: |
          cargo xtask test-mcp native-platform --desktop-input \
            --server "$GITHUB_WORKSPACE/src-tauri/target/debug/nbcad" \
            --out "$RUNNER_TEMP/native-input-macos"
      - name: Retain macOS input snapshots and native captures
        if: always() && inputs.desktop-input
        uses: actions/upload-artifact@v4
        with:
          name: native-input-macos
          path: ${{ runner.temp }}/native-input-macos/
          if-no-files-found: warn
          retention-days: 14

  windows-native-host-tests:
    name: Windows native Bevy host
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: native-host-windows
      - name: Install native geometry kernel
        id: occt
        uses: ./.github/actions/setup-windows-occt
        with:
          triplet: x64-windows
          runner-cache-key: windows-2025-x64-windows-msvc
          msvc-component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
      - name: Use the native geometry kernel
        shell: pwsh
        env:
          OCCT_SDK: ${{ steps.occt.outputs.root }}
        run: |
          "OCCT_ROOT=$env:OCCT_SDK" >> $env:GITHUB_ENV
          "$env:OCCT_SDK\bin" >> $env:GITHUB_PATH
      - name: Test concurrent first-use OCCT projection
        run: cargo test --locked -p nbcad-occt --features native-occt --test concurrent_drawing_init

      - name: Test the native Bevy host
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features dev-bevy-host --lib
      - name: Build the live native host
        if: inputs.desktop-input
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features dev-bevy-host --bin nbcad
      - name: Verify installed CJK and emoji fonts through Bevy shaping
        if: inputs.desktop-input
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features dev-bevy-host --lib native_font_fallback_shapes_ -- --ignored --nocapture
      - name: Exercise Windows keyboard and clipboard
        if: inputs.desktop-input
        shell: pwsh
        run: |
          cargo xtask test-mcp native-platform --desktop-input `
            --server "$env:GITHUB_WORKSPACE\src-tauri\target\debug\nbcad.exe" `
            --out "$env:RUNNER_TEMP\native-input-windows"
      - name: Retain Windows input snapshots and native captures
        if: always() && inputs.desktop-input
        uses: actions/upload-artifact@v4
        with:
          name: native-input-windows
          path: ${{ runner.temp }}/native-input-windows/
          if-no-files-found: warn
          retention-days: 14

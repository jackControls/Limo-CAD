name: Agent board
on:
  pull_request:
    paths:
      - 'crates/agent-board/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/agent-board.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-board-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-board:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt -p limo-cad-agent-board --check
      - run: cargo test --locked -p limo-cad-agent-board
      - run: cargo clippy --locked -p limo-cad-agent-board --all-targets -- -D warnings

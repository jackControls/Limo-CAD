name: Native sketch visual regressions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-platform-input:
    uses: ./.github/workflows/native-host-tests.yml
    with:
      desktop-input: true

  native-visual:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: desktop -> target
          key: native-visual
      - name: Install native geometry kernel
        run: brew install opencascade
      - name: Verify projected boundaries and thin-wall occlusion on the GPU
        env:
          LIMO_CAD_PREVIEW_PROOF_DIR: ${{ github.workspace }}/docs/qa/native-boundary
        run: OCCT_ROOT="$(brew --prefix opencascade)" cargo test --locked --manifest-path desktop/Cargo.toml --lib native_sketch_boundary_visual_matrix -- --ignored --nocapture
      - name: Retain native visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sketch-visuals
          path: docs/qa/native-boundary/
          if-no-files-found: warn
          retention-days: 14

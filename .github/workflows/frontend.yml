name: Frontend

on:
  push:
    branches: [main]
  # The browser/WASM product is checked independently of desktop packages.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sketch-interactions:
    name: Sketch browser smoke regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: sketch-wasm
      - name: Install pinned WASM packager
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Build current browser engine
        run: npm run build:wasm
      - name: Build browser application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Preview, commit, cancellation and history smoke tests
        run: npm run e2e:sketch-smoke
      - name: Broader sketch interaction regressions on main or manual runs
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm run e2e:sketch-regression
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sketch-browser-failure
          path: docs/qa/
          if-no-files-found: ignore
          retention-days: 7

  frontend-tests:
    name: Frontend regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts
      - name: Run all frontend regression suites
        run: npm run test:frontend
      - name: Check browser dispatcher parser
        run: node --test xtask/mcp/dispatched-actions.test.mjs
      - name: Test guarded application exit and control acknowledgements
        run: npx tsx scripts/applicationExit.test.ts
      - name: Check browser source types
        run: npx tsc --noEmit
      - name: Test live MCP snapshot revision boundaries
        run: npx tsx scripts/sessionSnapshot.test.ts
      - name: Install Chromium for UI contract checks
        run: npx playwright install --with-deps chromium
      - name: Install Rust for xtask
        uses: dtolnay/rust-toolchain@stable
      - name: Test live UI control contracts and product command coverage
        run: cargo xtask test-mcp contracts
      - name: Test associative drawing dimension references
        run: npx tsx scripts/drawingDimensions.test.ts

  repository-tooling:
    name: Repository script contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/ci/*.test.mjs

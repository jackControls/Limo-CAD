name: Disposable matched Bevy switching measurement

on:
  workflow_call:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      BASELINE_SHA: 82cd981eb9d835faf481a021c416e7733cfb9f91
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
      - uses: ./candidate/.github/actions/setup-rust
        id: rust
        with:
          directory: candidate
      - name: Use the candidate compiler for both builds
        run: echo "RUSTUP_TOOLCHAIN=${{ steps.rust.outputs.toolchain }}" >> "$GITHUB_ENV"
      - uses: ./candidate/.github/actions/setup-linux-desktop
        with:
          desktop-input: 'true'
      - name: Install isolated baseline SDK and window manager
        run: |
          sudo apt-get install --yes --no-install-recommends openbox x11-utils
          # xprop is required by the owned Openbox readiness check. Detect an
          # unavailable utility before spending time compiling either host.
          command -v xprop
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: switching-registry-${{ runner.os }}-${{ hashFiles('candidate/src-tauri/Cargo.lock', 'baseline/src-tauri/Cargo.lock') }}
          restore-keys: switching-registry-${{ runner.os }}-
      - name: Build pinned Bevy preview baseline and candidate before measuring
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/switching-target"
          evidence="$RUNNER_TEMP/native-switching"
          mkdir -p "$evidence/builds" "$RUNNER_TEMP/switching-binaries"
          rustc -Vv > "$evidence/builds/rustc.txt"
          uname -a > "$evidence/builds/kernel.txt"
          lscpu > "$evidence/builds/cpu.txt"
          dpkg-query -W > "$evidence/builds/packages.txt"
          for source in baseline candidate; do
            (
              cd "$GITHUB_WORKSPACE/$source"
              git rev-parse HEAD > "$evidence/builds/$source.sha"
              cp src-tauri/Cargo.lock "$evidence/builds/$source.Cargo.lock"
              cp Cargo.lock "$evidence/builds/$source.root.Cargo.lock"
              printf '%s\n' 'cargo build --locked --manifest-path src-tauri/Cargo.toml --release --bin nbcad' > "$evidence/builds/$source-native.command"
              cargo build --locked --manifest-path src-tauri/Cargo.toml --release --bin nbcad 2>&1 | tee "$evidence/builds/$source-native.log"
              cp "$CARGO_TARGET_DIR/release/nbcad" "$RUNNER_TEMP/switching-binaries/$source-native"
              if [[ "$source" == candidate ]]; then
                printf '%s\n' 'cargo build --locked -p xtask' > "$evidence/builds/driver.command"
                cargo build --locked -p xtask 2>&1 | tee "$evidence/builds/driver.log"
                cp "$CARGO_TARGET_DIR/debug/xtask" "$RUNNER_TEMP/switching-binaries/xtask"
              fi
            )
          done
          sha256sum "$evidence"/builds/*.lock > "$evidence/builds/source-inputs.sha256"
          sha256sum "$RUNNER_TEMP"/switching-binaries/* > "$evidence/builds/binaries.sha256"
          df -h > "$evidence/builds/disk-after-build.txt"
      - name: Measure sequentially with identical archives and reversed repeat order
        working-directory: candidate
        env:
          NBCAD_SWITCHING_CI: '1'
        run: bash xtask/platform/run-switching-comparison.sh
      - name: Retain exact inputs, source/build provenance, and partial or complete samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-switching-evidence
          path: ${{ runner.temp }}/native-switching/
          if-no-files-found: error
          retention-days: 14

[package]
name = "nbcad-sketch"
version.workspace = true
edition = "2021"
description = "noBS CAD 2D sketch model: entities, constraints, solver API (pure Rust, no OCCT)"
license = "LGPL-2.1-or-later"
repository = "https://github.com/jackControls/Limo-CAD"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.26.1", features = ["v4", "js"] }
nbcad-cam = { path = "../cam" }
nbcad-core = { path = "../core" }
nbcad-assembly = { path = "../assembly" }
nbcad-solid = { path = "../solid" }

[dev-dependencies]
